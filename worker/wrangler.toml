name = "cidex-infotech"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Static site files are served from ../public (copy the site file there as index.html before deploying).
[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

[vars]
OPENAI_MODEL = "gpt-6-astra"   # confirm the exact model ID in the OpenAI dashboard before deploy
USD_INR_RATE = "94"            # fixed rate, updated weekly
# OPENAI_API_KEY is NOT set here. Add it as a secret (see README.md).
